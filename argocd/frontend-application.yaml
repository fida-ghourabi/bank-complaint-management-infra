apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-complaint-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/fida-ghourabi/bank-complaint-management-infra.git
    targetRevision: main
    path: k8s/frontend

  destination:
    server: https://kubernetes.default.svc
    namespace: bank-complaint

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
