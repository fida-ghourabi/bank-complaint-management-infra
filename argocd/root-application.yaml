apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-complaint-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/fida-ghourabi/bank-complaint-management-infra.git
    targetRevision: main
    path: argocd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
